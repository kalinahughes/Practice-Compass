<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f4f3b" />
  <title>Practice Compass</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand-wrap">
      <div class="compass"><svg class="pc-symbol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="m14.8 9.2-2 5.6-3.6-3.6 5.6-2Z"></path><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"></path></svg></div>
      <div>
        <div class="brand">PRACTICE</div>
        <div class="brand">COMPASS</div>
      </div>
    </div>
    <button id="menuBtn" class="icon-btn" aria-label="Open menu"><svg class="pc-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"></path></svg></button>
  </header>

  <main id="main"></main>

  <nav class="bottom-nav">
    <button data-route="today" class="nav active"><span class="nav-symbol"><svg class="pc-nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 8-6 8 6v9H8v-6h8v6"></path></svg></span><small>Home</small></button>
    <button data-route="journal" class="nav"><span class="nav-symbol"><svg class="pc-nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H9l-4 4V5Z"></path><path d="M8 9h8M8 12h5"></path></svg></span><small>Reflect</small></button>
    <button data-route="assessments" class="nav"><span class="nav-symbol"><svg class="pc-nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V10"></path><path d="M12 13c-4 0-6-2-6-6 4 0 6 2 6 6ZM12 10c0-4 2-6 6-6 0 4-2 6-6 6Z"></path></svg></span><small>Placement</small></button>
    <button data-route="learn" class="nav"><span class="nav-symbol"><svg class="pc-nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"></path><path d="M8 4v16M8 16h11"></path></svg></span><small>Toolkit</small></button>
    <button data-route="more" class="nav"><span class="nav-symbol"><svg class="pc-nav-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 20c.8-4 3-6 6.5-6s5.7 2 6.5 6"></path></svg></span><small>Me</small></button>
  </nav>
  <footer class="site-footer">
    <div class="footer-mark"><svg class="pc-symbol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="m14.8 9.2-2 5.6-3.6-3.6 5.6-2Z"></path><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"></path></svg></div>
    <strong>Practice Compass</strong>
    <span>Created by Kalina Hughes</span>
    <span>© 2026 Kalina Hughes. All rights reserved.</span>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
